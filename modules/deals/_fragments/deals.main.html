  <main id="main" class="gr-container page-main">
    <nav class="breadcrumb-gr" aria-label="Breadcrumb">
      <a href="/">Home</a><span class="breadcrumb-gr__sep">/</span><span>Deals</span>
    </nav>

    <!-- The offer card, at a third of the height it used to take. On a 360px
         phone it stood 321px tall — 40% of the viewport spent on a banner
         before a single deal was visible. The long paragraph went with the
         padding: it promised what the grid below it already proves. -->
    <section class="deals-hero" data-reveal>
      <div class="deals-hero__copy">
        <p class="overline" style="color:#04222b">Limited-time</p>
        <h1 class="h1 deals-hero__title">Deals &amp; Offers <span class="head-gr__bn head-gr__bn--full" lang="bn">ছাড় ও অফার</span></h1>
        <p class="deals-hero__sub">Verified imports at a lower price.</p>
      </div>
      <p class="deals-hero__stat"><span class="deals-hero__num" data-deal-count>—</span> <span class="deals-hero__label">products on offer</span></p>
    </section>

    <!-- Biggest discounts -->
    <section aria-labelledby="top-head">
      <div class="deals-toolbar">
        <div class="section-head__titles"><p class="overline">Don’t miss</p><h2 id="top-head" class="h3">Biggest Discounts</h2></div>
      </div>
      <div class="product-grid" data-top-deals></div>
    </section>

    <!-- All deals -->
    <section aria-labelledby="all-head" class="section-sep">
      <div class="deals-toolbar">
        <div class="section-head__titles"><p class="overline">Everything on sale</p><h2 id="all-head" class="h3">All Deals</h2></div>
        <label class="sort-field caption"><span class="sort-field__label">Sort</span>
          <select class="select-gr btn-sm-gr" data-sort aria-label="Sort by">
            <option value="discount">Biggest discount</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Best rated</option>
          </select>
        </label>
      </div>
      <div class="product-grid" data-all-deals aria-live="polite"></div>
      <div class="empty-state" data-deals-empty hidden>
        <h2 class="empty-state__title">No active deals right now</h2>
        <p class="empty-state__text">Check back soon — or browse the full catalogue.</p>
        <a class="btn-gr btn-primary-gr" href="/category/imported-food-grocery">Browse all</a>
      </div>
    </section>
  </main>
