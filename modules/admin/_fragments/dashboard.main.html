      <div class="admin__head">
        <div>
          <h1 class="admin__title">Dashboard</h1>
          <p class="admin__sub" data-dash-sub>Loading today’s figures…</p>
        </div>
      </div>

      <!-- Filled from GET /api/admin/dashboard. The server decides which cards
           this role may receive; the client only lays out what it is given, so
           a warehouse account is never sent the revenue figure at all. -->
      <div class="acards" data-dash-cards></div>

      <p class="admin__sub" data-dash-empty hidden>
        No cards to show yet. Cards appear as modules are installed — orders,
        inventory and accounting each contribute their own.
      </p>

      <!-- Setup check. Hidden entirely when everything passes: a permanent
           green panel on the screen you see most is noise, and noise is what
           stops a red one being noticed. It appears only when something is
           actually wrong, and says what to do about it. -->
      <section class="acard acard--danger" data-dash-health hidden
               style="margin-top:var(--space-5)" aria-labelledby="dh-head">
        <h2 class="h5" id="dh-head" style="margin:0 0 var(--space-2)">Something needs attention</h2>
        <ul class="arefunds" data-dash-health-list role="list"></ul>
      </section>
