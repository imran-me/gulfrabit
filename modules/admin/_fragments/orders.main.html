      <div class="admin__head">
        <div>
          <h1 class="admin__title">Orders</h1>
          <p class="admin__sub" data-orders-count>Loading…</p>
        </div>
      </div>

      <!-- The pipeline, as places rather than as a dropdown. Filled by
           orders-page.js from the stage list the server sends counts for, so a
           stage added to the backend appears here without editing this file. -->
      <nav class="atabs" data-orders-tabs aria-label="Order stages"></nav>

      <!-- Filters. Every control maps to a validated query parameter, and the
           state lives in the URL so a filtered view can be bookmarked and
           shared with a colleague rather than described to them.
           `status` is a hidden input, not a dropdown: the tab bar above owns
           it, and two controls for one value is how they end up disagreeing. -->
      <form class="afilters" data-orders-filters>
        <input type="hidden" name="status" value="">
        <!-- Owned by the Deleted tab in the bar above, for the same reason
             `status` is owned by the stage tabs: two controls for one value is
             how they end up disagreeing. -->
        <input type="hidden" name="deleted" value="">
        <div class="afilters__field">
          <label for="f-q">Search</label>
          <input class="input-gr" id="f-q" name="q" type="search" placeholder="Order no, phone or name">
        </div>
        <div class="afilters__field">
          <label for="f-pay">Payment</label>
          <select class="select-gr" id="f-pay" name="paymentStatus">
            <option value="">Any payment</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div class="afilters__field">
          <label for="f-from">From</label>
          <input class="input-gr" id="f-from" name="from" type="date">
        </div>
        <div class="afilters__field">
          <label for="f-to">To</label>
          <input class="input-gr" id="f-to" name="to" type="date">
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Apply</button>
          <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-orders-clear>Clear</button>
        </div>
      </form>

      <!-- Appears only with a selection. A permanently visible bar of actions
           that do nothing yet is a bar people learn to ignore. -->
      <div class="abulk" data-orders-bulk hidden>
        <strong data-bulk-count></strong>
        <div class="abulk__actions" data-bulk-actions></div>
        <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-bulk-clear>Clear selection</button>
      </div>

      <div class="atable-wrap">
        <table class="atable atable--dense">
          <thead>
            <tr>
              <th scope="col" class="atable__pick">
                <input type="checkbox" data-select-all aria-label="Select every order on this page">
              </th>
              <!-- Order and Placed are one column. They answer the same
                   question — which order, and how long has it been sitting —
                   and splitting them cost 90px on the widest table in the
                   panel while putting two facts about one order at opposite
                   ends of the row. -->
              <th scope="col">Order</th>
              <th scope="col">Customer</th>
              <!-- Not "District". The district is the half of a Bangladeshi
                   address that decides nothing; the thana under it is the half
                   that decides who drives. -->
              <th scope="col">Deliver to</th>
              <th scope="col">Items</th>
              <!-- Total and Payment are one column. What the order comes to,
                   what has happened to that money, and how it is being paid are
                   one subject, and three of the nine columns were spending
                   their width on padding rather than on content. -->
              <th scope="col">Total</th>
              <th scope="col">Status</th>
              <!-- The next step, on the row. Working twenty orders through a
                   stage should not mean opening twenty pages. -->
              <th scope="col"><span class="visually-hidden">Move to next stage</span></th>
            </tr>
          </thead>
          <tbody data-orders-body>
            <tr><td colspan="8" class="atable__empty">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>

      <nav class="apager" data-orders-pager hidden aria-label="Order pages">
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-prev>← Previous</button>
        <span data-page-label></span>
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-next>Next →</button>
      </nav>
