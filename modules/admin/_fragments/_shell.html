  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <div class="admin__top">
        <a class="admin__brand" href="/admin">
          <!-- 120px into a 32px box. The 520px master is 216 KB and this
               sidebar is on every admin screen — including the ones the
               catalogue actually gets maintained from, on a phone. -->
          <picture>
            <source type="image/webp" srcset="/assets/logo/gulfrabit-mark-120.webp">
            <img src="/assets/logo/gulfrabit-mark-120.png" alt="">
          </picture>
          <span>GulfRabit<small>Admin</small></span>
        </a>

        <!-- Collapses the sidebar to a 72px rail of icons. Sixteen screens and
             a 248px column cost a quarter of a 13" laptop's width, and the
             screens that need the width most — the orders table, the product
             editor — are the ones staff sit in all day. Railed, the sidebar
             still opens on hover, so nothing is actually further away. -->
        <button type="button" class="admin__rail" data-admin-rail
                aria-expanded="true" aria-label="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
          </svg>
        </button>
      </div>

      <!-- The visible half of the jump-to. A keyboard shortcut nobody is told
           about is not a feature, so the shortcut is printed on the control
           that also works when clicked. admin-shell.js writes Ctrl or the
           Command glyph into the <kbd> depending on the platform. -->
      <button type="button" class="anav-find" data-admin-find
              aria-label="Jump to a screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
        </svg>
        <!-- Short, because the shortcut has to fit beside it inside 248px, and
             the accessible name is on the button rather than in this span. -->
        <span>Jump to…</span>
        <kbd data-admin-find-key>Ctrl K</kbd>
      </button>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <!-- A real <dialog>, opened with showModal(). The focus trap, Escape, the
         inert background and returning focus to whatever opened it are all the
         platform's job then, and none of them can quietly stop being true the
         way a hand-rolled overlay's can. The list is filled by admin-shell.js
         from the same registry the sidebar paints from, so a screen this role
         may not open is not offered here either. -->
    <dialog class="apal" data-admin-palette aria-label="Jump to a screen">
      <div class="apal__search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
        </svg>
        <input class="apal__input" type="text" data-palette-input
               placeholder="Jump to a screen…" autocomplete="off"
               spellcheck="false" aria-label="Jump to a screen"
               role="combobox" aria-expanded="true" aria-controls="apal-list"
               aria-autocomplete="list">
      </div>
      <ul class="apal__list" id="apal-list" role="listbox" data-palette-list
          aria-label="Screens"></ul>
      <p class="apal__none" data-palette-none hidden>No screen matches that.</p>
      <p class="apal__hint">
        <kbd>↑</kbd><kbd>↓</kbd> to move · <kbd>Enter</kbd> to open · <kbd>Esc</kbd> to close
      </p>
    </dialog>

    <main class="admin__main" id="main">
