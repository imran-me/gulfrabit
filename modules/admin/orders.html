<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');

    /* THEME, BEFORE THE FIRST PAINT.
       The theme is universal — one setting for the whole shop — and the server
       is its authority. But this HTML is static, so a page has to decide what
       to paint before it can ask anything, or a Luxe shop shows a frame of
       Classic on every single navigation.

       `gr:theme` is a MIRROR of the last answer the server gave, written only
       by modules/theme/theme.js after a successful read. So:
         - a mirror exists  -> the visitor has been told the published theme
                               before; paint that, and let theme.js confirm.
         - no mirror        -> leave whatever was baked in at build time, which
                               on a static deployment is the universal theme.

       Both directions matter. A page built as Luxe whose mirror says Classic
       must REMOVE the attribute, not ignore the mirror — otherwise switching
       the shop back would never reach anyone who had already visited.

       THE LIST IS GENERATED, NOT TYPED. This used to read `=== 'luxe'` and
       remove the attribute for everything else, which was correct while Luxe
       was the only non-Classic theme and silently wrong the moment it was not:
       a shop published as Noor, Nakshi or Utsab painted Classic white on every
       single navigation and then flipped once /api/theme resolved. The theme
       still arrived — it just arrived after the flash this block exists to
       prevent, on every page, forever. Interpolating STOREFRONT_THEMES means a
       theme cannot be added without this knowing about it.

       Inline and above the stylesheet on purpose: a deferred script runs after
       the first paint, which is the flash it exists to prevent. */
    try {
      var t = localStorage.getItem('gr:theme');
      if (t) {
        var el = document.documentElement;
        var v = JSON.parse(t);
        if (['luxe','trio','noor','nakshi','utsab'].indexOf(v) > -1) el.setAttribute('data-theme', v);
        else el.removeAttribute('data-theme');
      }
    } catch (e) { /* private mode, or nothing stored — the built-in theme stands. */ }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontshare serves its @font-face CSS from api. and the font FILES from
       cdn. Only the CSS host was preconnected, so the display face waited on a
       fresh DNS + TLS handshake discovered halfway through the render — the
       most expensive moment to find a new origin. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Cinzel:wght@600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">

<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../admin">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <h1 class="admin__title">Orders</h1>
          <p class="admin__sub" data-orders-count>Loading…</p>
        </div>
      </div>

      <!-- The pipeline, as places rather than as a dropdown. Filled by
           orders-page.js from the stage list the server sends counts for, so a
           stage added to the backend appears here without editing this file. -->
      <nav class="atabs" data-orders-tabs aria-label="Order stages"></nav>

      <!-- Filters. Every control maps to a validated query parameter, and the
           state lives in the URL so a filtered view can be bookmarked and
           shared with a colleague rather than described to them.
           `status` is a hidden input, not a dropdown: the tab bar above owns
           it, and two controls for one value is how they end up disagreeing. -->
      <form class="afilters" data-orders-filters>
        <input type="hidden" name="status" value="">
        <!-- Owned by the Deleted tab in the bar above, for the same reason
             `status` is owned by the stage tabs: two controls for one value is
             how they end up disagreeing. -->
        <input type="hidden" name="deleted" value="">
        <div class="afilters__field">
          <label for="f-q">Search</label>
          <input class="input-gr" id="f-q" name="q" type="search" placeholder="Order no, phone or name">
        </div>
        <div class="afilters__field">
          <label for="f-pay">Payment</label>
          <select class="select-gr" id="f-pay" name="paymentStatus">
            <option value="">Any payment</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div class="afilters__field">
          <label for="f-from">From</label>
          <input class="input-gr" id="f-from" name="from" type="date">
        </div>
        <div class="afilters__field">
          <label for="f-to">To</label>
          <input class="input-gr" id="f-to" name="to" type="date">
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Apply</button>
          <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-orders-clear>Clear</button>
        </div>
      </form>

      <!-- Appears only with a selection. A permanently visible bar of actions
           that do nothing yet is a bar people learn to ignore. -->
      <div class="abulk" data-orders-bulk hidden>
        <strong data-bulk-count></strong>
        <div class="abulk__actions" data-bulk-actions></div>
        <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-bulk-clear>Clear selection</button>
      </div>

      <div class="atable-wrap">
        <table class="atable">
          <thead>
            <tr>
              <th scope="col" class="atable__pick">
                <input type="checkbox" data-select-all aria-label="Select every order on this page">
              </th>
              <th scope="col">Order</th>
              <th scope="col">Customer</th>
              <th scope="col">District</th>
              <th scope="col">Items</th>
              <th scope="col">Total</th>
              <th scope="col">Payment</th>
              <th scope="col">Status</th>
              <th scope="col">Placed</th>
              <!-- The next step, on the row. Working twenty orders through a
                   stage should not mean opening twenty pages. -->
              <th scope="col"><span class="visually-hidden">Move to next stage</span></th>
            </tr>
          </thead>
          <tbody data-orders-body>
            <tr><td colspan="10" class="atable__empty">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>

      <nav class="apager" data-orders-pager hidden aria-label="Order pages">
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-prev>← Previous</button>
        <span data-page-label></span>
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-next>Next →</button>
      </nav>
    </main>
  </div>
