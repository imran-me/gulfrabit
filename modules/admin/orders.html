<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — GulfRabit Admin</title>
  <meta name="description" content="GulfRabit staff panel.">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="author" content="GulfRabit">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GulfRabit">
  <meta property="og:title" content="Orders — GulfRabit Admin">
  <meta property="og:description" content="GulfRabit staff panel.">
  <meta property="og:image" content="https://gulfrabit.com/assets/images/hero/hero-food.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Orders — GulfRabit Admin">
  <meta name="twitter:description" content="GulfRabit staff panel.">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="../../assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontshare serves its @font-face CSS from api. and the font FILES from
       cdn. Only the CSS host was preconnected, so the display face waited on a
       fresh DNS + TLS handshake discovered halfway through the render — the
       most expensive moment to find a new origin. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/gulfrabit.css?v=ca4019a1">
  <link rel="stylesheet" href="../../modules/admin/admin.css?v=ff327c79">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"GulfRabit","url":"https://gulfrabit.com","logo":"https://gulfrabit.com/assets/logo/gulfrabit-logo-dark-bg.jpeg","description":"Premium import marketplace for Bangladesh.","slogan":"Shop Smart. Hop Fast.","areaServed":"BD"}
  </script>
</head>
<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../modules/admin/index.html">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <h1 class="admin__title">Orders</h1>
          <p class="admin__sub" data-orders-count>Loading…</p>
        </div>
      </div>

      <!-- Filters. Every control maps to a validated query parameter, and the
           state lives in the URL so a filtered view can be bookmarked and
           shared with a colleague rather than described to them. -->
      <form class="afilters" data-orders-filters>
        <div class="afilters__field">
          <label for="f-q">Search</label>
          <input class="input-gr" id="f-q" name="q" type="search" placeholder="Order no, phone or name">
        </div>
        <div class="afilters__field">
          <label for="f-status">Status</label>
          <select class="select-gr" id="f-status" name="status">
            <option value="">Any status</option>
            <option value="placed">Placed</option>
            <option value="confirmed">Confirmed</option>
            <option value="packed">Packed</option>
            <option value="shipped">Shipped</option>
            <option value="delivered">Delivered</option>
            <option value="cancelled">Cancelled</option>
            <option value="returned">Returned</option>
          </select>
        </div>
        <div class="afilters__field">
          <label for="f-pay">Payment</label>
          <select class="select-gr" id="f-pay" name="paymentStatus">
            <option value="">Any payment</option>
            <option value="pending">Pending</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="refunded">Refunded</option>
          </select>
        </div>
        <div class="afilters__field">
          <label for="f-from">From</label>
          <input class="input-gr" id="f-from" name="from" type="date">
        </div>
        <div class="afilters__field">
          <label for="f-to">To</label>
          <input class="input-gr" id="f-to" name="to" type="date">
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Apply</button>
          <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-orders-clear>Clear</button>
        </div>
      </form>

      <div class="atable-wrap">
        <table class="atable">
          <thead>
            <tr>
              <th scope="col">Order</th>
              <th scope="col">Customer</th>
              <th scope="col">District</th>
              <th scope="col">Items</th>
              <th scope="col">Total</th>
              <th scope="col">Payment</th>
              <th scope="col">Status</th>
              <th scope="col">Placed</th>
            </tr>
          </thead>
          <tbody data-orders-body>
            <tr><td colspan="8" class="atable__empty">Loading orders…</td></tr>
          </tbody>
        </table>
      </div>

      <nav class="apager" data-orders-pager hidden aria-label="Order pages">
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-prev>← Previous</button>
        <span data-page-label></span>
        <button class="btn-gr btn-outline-gr btn-sm-gr" type="button" data-page-next>Next →</button>
      </nav>
    </main>
  </div>

  <script type="module" src="../../shared/js/main.js?v=7fb0ff79"></script>

  <script type="module" src="../../modules/marketing/marketing-nav.js?v=d884c4ac"></script>
  <script type="module" src="../../modules/accounting/accounting-nav.js?v=ebff64a4"></script>

  <script type="module" src="../../modules/admin/orders-page.js?v=7994bddd"></script>
</body>
</html>
