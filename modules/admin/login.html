<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff sign-in — GulfRabit Admin</title>
  <meta name="description" content="GulfRabit staff panel.">

  <meta name="author" content="GulfRabit">

<body>
<main class="alogin" id="main">
    <form class="alogin__box" data-admin-login novalidate>
      <div class="alogin__brand"><img src="../../assets/logo/gulfrabit-mark.png" alt="GulfRabit"></div>
      <h1>Staff sign-in</h1>
      <p class="alogin__sub">This panel is for GulfRabit staff. It is not a customer login.</p>

      <p class="alogin__error" data-login-error hidden role="alert"></p>

      <div class="alogin__field">
        <label for="a-email">Work email</label>
        <input class="input-gr" id="a-email" name="email" type="email" autocomplete="username" required>
      </div>

      <div class="alogin__field">
        <label for="a-password">Password</label>
        <input class="input-gr" id="a-password" name="password" type="password" autocomplete="current-password" required>
      </div>

      <button class="btn-gr btn-primary-gr btn-block-gr" type="submit" data-login-submit>Sign in</button>

      <p class="alogin__note">
        Customer account? <a href="../../modules/auth/login.html">Sign in to the shop instead</a>.
      </p>
    </form>
  </main>

  <script type="module" src="../../shared/js/main.js?v=0075d1b6"></script>
  <script type="module" src="../../modules/admin/login-page.js?v=cda17742"></script>
</body>
