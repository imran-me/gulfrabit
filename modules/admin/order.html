<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order — GulfRabit Admin</title>
  <meta name="description" content="GulfRabit staff panel.">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="author" content="GulfRabit">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GulfRabit">
  <meta property="og:title" content="Order — GulfRabit Admin">
  <meta property="og:description" content="GulfRabit staff panel.">
  <meta property="og:image" content="https://gulfrabit.com/assets/images/hero/hero-food.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Order — GulfRabit Admin">
  <meta name="twitter:description" content="GulfRabit staff panel.">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="../../assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontshare serves its @font-face CSS from api. and the font FILES from
       cdn. Only the CSS host was preconnected, so the display face waited on a
       fresh DNS + TLS handshake discovered halfway through the render — the
       most expensive moment to find a new origin. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/gulfrabit.css?v=07146819">
  <link rel="stylesheet" href="../../modules/admin/admin.css?v=ff327c79">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"GulfRabit","url":"https://gulfrabit.com","logo":"https://gulfrabit.com/assets/logo/gulfrabit-logo-dark-bg.jpeg","description":"Premium import marketplace for Bangladesh.","slogan":"Shop Smart. Hop Fast.","areaServed":"BD"}
  </script>
</head>
<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../modules/admin/index.html">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <p class="admin__sub" style="margin:0 0 .25rem"><a href="../../modules/admin/orders.html">← All orders</a></p>
          <h1 class="admin__title" data-order-number>Order</h1>
          <p class="admin__sub" data-order-meta></p>
        </div>
        <!-- Only the transitions the SERVER says are legal for this order and
             this role are ever drawn here — the list comes back in the payload
             rather than being computed in the browser, so the panel cannot
             offer a button the API would refuse. -->
        <div class="aactions" data-order-actions></div>
      </div>

      <div class="aorder">
        <section class="acard" aria-labelledby="oi-head">
          <h2 class="h5" id="oi-head">Items</h2>
          <div class="atable-wrap">
            <table class="atable atable--tight">
              <thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Unit</th><th scope="col">Line</th></tr></thead>
              <tbody data-order-items></tbody>
            </table>
          </div>
          <dl class="atotals" data-order-totals></dl>
        </section>

        <section class="acard" aria-labelledby="oc-head">
          <h2 class="h5" id="oc-head">Customer &amp; delivery</h2>
          <dl class="akv" data-order-customer></dl>
        </section>

        <section class="acard" aria-labelledby="oh-head">
          <h2 class="h5" id="oh-head">History</h2>
          <ol class="atimeline" data-order-history></ol>
        </section>

        <section class="acard" aria-labelledby="or-head" data-refund-section hidden>
          <h2 class="h5" id="or-head">Refunds</h2>
          <ul class="arefunds" data-order-refunds role="list"></ul>
          <form class="arefund-form" data-refund-form hidden>
            <p class="admin__sub" data-refundable></p>
            <div class="afilters__field">
              <label for="r-amount">Amount (৳)</label>
              <input class="input-gr" id="r-amount" name="amountTaka" type="number" step="0.01" min="0.01" required>
            </div>
            <div class="afilters__field">
              <label for="r-method">Back via</label>
              <select class="select-gr" id="r-method" name="method">
                <option value="original">However they paid</option>
                <option value="bkash">bKash</option>
                <option value="nagad">Nagad</option>
                <option value="bank">Bank transfer</option>
                <option value="cash">Cash</option>
                <option value="store_credit">Store credit</option>
              </select>
            </div>
            <div class="afilters__field afilters__field--wide">
              <label for="r-reason">Reason</label>
              <input class="input-gr" id="r-reason" name="reason" type="text" required
                     placeholder="Why is this being refunded?">
            </div>
            <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Record refund</button>
          </form>
        </section>
      </div>

      <p class="aerror" data-order-error hidden role="alert"></p>
    </main>
  </div>

  <script type="module" src="../../shared/js/main.js?v=1b8847af"></script>
  <script type="module" src="../../modules/admin/admin-shell.js?v=f1c653e6"></script>
  <script type="module" src="../../modules/admin/admin-nav.js?v=0ecf6647"></script>
  <script type="module" src="../../modules/courier/courier-nav.js?v=8f34525c"></script>
  <script type="module" src="../../modules/inventory/inventory-nav.js?v=ada58157"></script>
  <script type="module" src="../../modules/media/media-nav.js?v=526e2641"></script>
  <script type="module" src="../../modules/highlights/highlights-nav.js?v=041907b8"></script>
  <script type="module" src="../../modules/marketing/marketing-nav.js?v=d884c4ac"></script>
  <script type="module" src="../../modules/accounting/accounting-nav.js?v=ebff64a4"></script>
  <script type="module" src="../../modules/b2b/b2b-nav.js?v=87de770c"></script>
  <script type="module" src="../../modules/admin/order-detail-page.js?v=9a286ccf"></script>
  <script type="module" src="../../modules/courier/courier-order-panel.js?v=c3f0b784"></script>
</body>
</html>
