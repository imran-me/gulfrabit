<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');

    /* THEME, BEFORE THE FIRST PAINT.
       The theme is universal — one setting for the whole shop — and the server
       is its authority. But this HTML is static, so a page has to decide what
       to paint before it can ask anything, or a Luxe shop shows a frame of
       Classic on every single navigation.

       `gr:theme` is a MIRROR of the last answer the server gave, written only
       by modules/theme/theme.js after a successful read. So:
         - a mirror exists  -> the visitor has been told the published theme
                               before; paint that, and let theme.js confirm.
         - no mirror        -> leave whatever was baked in at build time, which
                               on a static deployment is the universal theme.

       Both directions matter. A page built as Luxe whose mirror says Classic
       must REMOVE the attribute, not ignore the mirror — otherwise switching
       the shop back would never reach anyone who had already visited.

       Inline and above the stylesheet on purpose: a deferred script runs after
       the first paint, which is the flash it exists to prevent. */
    try {
      var t = localStorage.getItem('gr:theme');
      if (t) {
        var el = document.documentElement;
        if (JSON.parse(t) === 'luxe') el.setAttribute('data-theme', 'luxe');
        else el.removeAttribute('data-theme');
      }
    } catch (e) { /* private mode, or nothing stored — the built-in theme stands. */ }
  </script>

       most expensive moment to find a new origin. -->

  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>

<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../modules/admin/index.html">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <h1 class="admin__title">Dashboard</h1>
          <p class="admin__sub" data-dash-sub>Loading today’s figures…</p>
        </div>
      </div>

      <!-- Filled from GET /api/admin/dashboard. The server decides which cards
           this role may receive; the client only lays out what it is given, so
           a warehouse account is never sent the revenue figure at all. -->
      <div class="acards" data-dash-cards></div>

      <p class="admin__sub" data-dash-empty hidden>
        No cards to show yet. Cards appear as modules are installed — orders,
        inventory and accounting each contribute their own.
      </p>

      <!-- Setup check. Hidden entirely when everything passes: a permanent
           green panel on the screen you see most is noise, and noise is what
           stops a red one being noticed. It appears only when something is
           actually wrong, and says what to do about it. -->
      <section class="acard acard--danger" data-dash-health hidden
               style="margin-top:var(--space-5)" aria-labelledby="dh-head">
        <h2 class="h5" id="dh-head" style="margin:0 0 var(--space-2)">Something needs attention</h2>
        <ul class="arefunds" data-dash-health-list role="list"></ul>
      </section>
    </main>
  </div>
