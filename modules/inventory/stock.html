<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock — GulfRabit Admin</title>
  <meta name="description" content="GulfRabit staff panel.">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="author" content="GulfRabit">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <!-- Social / Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GulfRabit">
  <meta property="og:title" content="Stock — GulfRabit Admin">
  <meta property="og:description" content="GulfRabit staff panel.">
  <meta property="og:image" content="https://gulfrabit.com/assets/images/hero/hero-food.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stock — GulfRabit Admin">
  <meta name="twitter:description" content="GulfRabit staff panel.">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../../assets/logo/favicon-32.png">
  <link rel="apple-touch-icon" href="../../assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="../../site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fontshare serves its @font-face CSS from api. and the font FILES from
       cdn. Only the CSS host was preconnected, so the display face waited on a
       fresh DNS + TLS handshake discovered halfway through the render — the
       most expensive moment to find a new origin. -->
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/gulfrabit.css?v=ca4019a1">
  <link rel="stylesheet" href="../../modules/admin/admin.css?v=ff327c79">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"Organization","name":"GulfRabit","url":"https://gulfrabit.com","logo":"https://gulfrabit.com/assets/logo/gulfrabit-logo-dark-bg.jpeg","description":"Premium import marketplace for Bangladesh.","slogan":"Shop Smart. Hop Fast.","areaServed":"BD"}
  </script>
</head>
<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../modules/admin/index.html">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <h1 class="admin__title">Stock</h1>
          <p class="admin__sub" data-stock-count>Loading…</p>
        </div>
      </div>

      <form class="afilters" data-stock-filters>
        <div class="afilters__field">
          <label for="sf-q">Search</label>
          <input class="input-gr" id="sf-q" name="q" type="search" placeholder="Product name or SKU">
        </div>
        <div class="afilters__field">
          <label for="sf-wh">Warehouse</label>
          <select class="select-gr" id="sf-wh" name="warehouse"><option value="">All</option></select>
        </div>
        <div class="afilters__field">
          <label for="sf-low">Show</label>
          <select class="select-gr" id="sf-low" name="lowOnly">
            <option value="">Everything</option>
            <option value="1">At or below reorder level</option>
          </select>
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Apply</button>
          <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-stock-clear>Clear</button>
        </div>
      </form>

      <div class="atable-wrap">
        <table class="atable">
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Warehouse</th>
              <th scope="col">On hand</th>
              <th scope="col">Reserved</th>
              <th scope="col">Available</th>
              <th scope="col">Reorder at</th>
            </tr>
          </thead>
          <tbody data-stock-body>
            <tr><td colspan="6" class="atable__empty">Loading stock…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Every change is a movement with a reason. There is no "set the
           quantity to N" control anywhere in this panel, on purpose: a ledger
           that can be overwritten stops being able to explain its own balance,
           and shrinkage is a number you can only produce if damage and theft
           were never recorded as generic corrections. -->
      <section class="acard" style="margin-top:var(--space-5)" aria-labelledby="sm-head">
        <h2 class="h5" id="sm-head">Record a movement</h2>
        <form class="arefund-form" data-move-form style="border-top:0;padding-top:0">
          <div class="afilters__field">
            <label for="m-sku">SKU</label>
            <input class="input-gr" id="m-sku" name="sku" type="text" required placeholder="gr-1101">
          </div>
          <div class="afilters__field">
            <label for="m-wh">Warehouse</label>
            <select class="select-gr" id="m-wh" name="warehouse" required></select>
          </div>
          <div class="afilters__field">
            <label for="m-reason">Reason</label>
            <select class="select-gr" id="m-reason" name="reason">
              <option value="receipt">Stock arrived</option>
              <option value="return">Customer return (resaleable)</option>
              <option value="damage">Damaged / expired</option>
              <option value="theft">Known loss</option>
              <option value="transfer_in">Transfer in</option>
              <option value="transfer_out">Transfer out</option>
            </select>
          </div>
          <div class="afilters__field">
            <label for="m-qty">Quantity</label>
            <input class="input-gr" id="m-qty" name="qty" type="number" required placeholder="12 or -3">
          </div>
          <div class="afilters__field">
            <label for="m-cost">Unit cost ৳ <span class="atable__sub">(receipts)</span></label>
            <input class="input-gr" id="m-cost" name="unitCostTaka" type="number" step="0.01" min="0">
          </div>
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Record</button>
          <p class="admin__sub" style="flex:1 1 100%">
            Enter the unit cost on every receipt. It is the only source for cost of goods —
            without it, reports can show revenue but not profit.
          </p>
        </form>
      </section>

      <p class="aerror" data-stock-error hidden role="alert"></p>
    </main>
  </div>

  <script type="module" src="../../shared/js/main.js?v=7fb0ff79"></script>
  <script type="module" src="../../modules/admin/admin-shell.js?v=f1c653e6"></script>
  <script type="module" src="../../modules/admin/admin-nav.js?v=0ecf6647"></script>
  <script type="module" src="../../modules/courier/courier-nav.js?v=8f34525c"></script>
  <script type="module" src="../../modules/inventory/inventory-nav.js?v=ada58157"></script>
  <script type="module" src="../../modules/media/media-nav.js?v=526e2641"></script>
  <script type="module" src="../../modules/highlights/highlights-nav.js?v=041907b8"></script>
  <script type="module" src="../../modules/marketing/marketing-nav.js?v=d884c4ac"></script>
  <script type="module" src="../../modules/accounting/accounting-nav.js?v=ebff64a4"></script>
  <script type="module" src="../../modules/b2b/b2b-nav.js?v=87de770c"></script>
  <script type="module" src="../../modules/inventory/stock-page.js?v=dca8073d"></script>
</body>
</html>
