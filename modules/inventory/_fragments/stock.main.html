      <div class="admin__head">
        <div>
          <h1 class="admin__title">Stock</h1>
          <p class="admin__sub" data-stock-count>Loading…</p>
        </div>
      </div>

      <form class="afilters" data-stock-filters>
        <div class="afilters__field">
          <label for="sf-q">Search</label>
          <input class="input-gr" id="sf-q" name="q" type="search" placeholder="Product name or SKU">
        </div>
        <div class="afilters__field">
          <label for="sf-wh">Warehouse</label>
          <select class="select-gr" id="sf-wh" name="warehouse"><option value="">All</option></select>
        </div>
        <div class="afilters__field">
          <label for="sf-low">Show</label>
          <select class="select-gr" id="sf-low" name="lowOnly">
            <option value="">Everything</option>
            <option value="1">At or below reorder level</option>
          </select>
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Apply</button>
          <button class="btn-gr btn-ghost-gr btn-sm-gr" type="button" data-stock-clear>Clear</button>
        </div>
      </form>

      <div class="atable-wrap">
        <table class="atable">
          <thead>
            <tr>
              <th scope="col">Product</th>
              <th scope="col">Warehouse</th>
              <th scope="col">On hand</th>
              <th scope="col">Reserved</th>
              <th scope="col">Available</th>
              <th scope="col">Reorder at</th>
            </tr>
          </thead>
          <tbody data-stock-body>
            <tr><td colspan="6" class="atable__empty">Loading stock…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Every change is a movement with a reason. There is no "set the
           quantity to N" control anywhere in this panel, on purpose: a ledger
           that can be overwritten stops being able to explain its own balance,
           and shrinkage is a number you can only produce if damage and theft
           were never recorded as generic corrections. -->
      <section class="acard" style="margin-top:var(--space-5)" aria-labelledby="sm-head">
        <h2 class="h5" id="sm-head">Record a movement</h2>
        <form class="arefund-form" data-move-form style="border-top:0;padding-top:0">
          <div class="afilters__field">
            <label for="m-sku">SKU</label>
            <input class="input-gr" id="m-sku" name="sku" type="text" required placeholder="gr-1101">
          </div>
          <div class="afilters__field">
            <label for="m-wh">Warehouse</label>
            <select class="select-gr" id="m-wh" name="warehouse" required></select>
          </div>
          <div class="afilters__field">
            <label for="m-reason">Reason</label>
            <select class="select-gr" id="m-reason" name="reason">
              <option value="receipt">Stock arrived</option>
              <option value="return">Customer return (resaleable)</option>
              <option value="damage">Damaged / expired</option>
              <option value="theft">Known loss</option>
              <option value="transfer_in">Transfer in</option>
              <option value="transfer_out">Transfer out</option>
            </select>
          </div>
          <div class="afilters__field">
            <label for="m-qty">Quantity</label>
            <input class="input-gr" id="m-qty" name="qty" type="number" required placeholder="12 or -3">
          </div>
          <div class="afilters__field">
            <label for="m-cost">Unit cost ৳ <span class="atable__sub">(receipts)</span></label>
            <input class="input-gr" id="m-cost" name="unitCostTaka" type="number" step="0.01" min="0">
          </div>
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Record</button>
          <p class="admin__sub" style="flex:1 1 100%">
            Enter the unit cost on every receipt. It is the only source for cost of goods —
            without it, reports can show revenue but not profit.
          </p>
        </form>
      </section>

      <p class="aerror" data-stock-error hidden role="alert"></p>
