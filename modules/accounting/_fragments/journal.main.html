      <div class="admin__head">
        <div>
          <h1 class="admin__title">Journal</h1>
          <p class="admin__sub" data-jr-count>Loading…</p>
        </div>
      </div>

      <section class="acard" style="margin-bottom:var(--space-5)" aria-labelledby="ex-head">
        <h2 class="h5" id="ex-head">Record an expense</h2>
        <p class="admin__sub" style="margin-top:0">
          This writes an ordinary double entry — the expense account is debited and whatever you
          paid from is credited. There is no separate expense list to reconcile against.
        </p>
        <form class="arefund-form" data-expense-form style="border-top:0;padding-top:0">
          <div class="afilters__field">
            <label for="ex-amount">Amount ৳</label>
            <input class="input-gr" id="ex-amount" name="amountTaka" type="number" step="0.01" min="0.01" required>
          </div>
          <div class="afilters__field">
            <label for="ex-account">Expense account</label>
            <select class="select-gr" id="ex-account" name="accountCode" required></select>
          </div>
          <div class="afilters__field">
            <label for="ex-paid">Paid from</label>
            <select class="select-gr" id="ex-paid" name="paidFrom" required></select>
          </div>
          <div class="afilters__field">
            <label for="ex-date">Date</label>
            <input class="input-gr" id="ex-date" name="date" type="date">
          </div>
          <div class="afilters__field afilters__field--wide">
            <label for="ex-desc">What was it for</label>
            <input class="input-gr" id="ex-desc" name="description" type="text" required
                   placeholder="Recorded against this entry permanently">
          </div>
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Record expense</button>
        </form>
      </section>

      <div class="atable-wrap">
        <table class="atable">
          <thead>
            <tr>
              <th scope="col">Ref</th>
              <th scope="col">Date</th>
              <th scope="col">Memo</th>
              <th scope="col">Lines</th>
              <th scope="col">Amount</th>
              <th scope="col">By</th>
            </tr>
          </thead>
          <tbody data-jr-body>
            <tr><td colspan="6" class="atable__empty">Loading journal…</td></tr>
          </tbody>
        </table>
      </div>

      <p class="aerror" data-jr-error hidden role="alert"></p>
