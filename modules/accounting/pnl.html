  <meta charset="UTF-8">
  <script>
    /* Removes .no-js before first paint. Everything with [data-reveal] is
       hidden by CSS until IntersectionObserver reveals it — which means with
       JavaScript off it stayed hidden forever, taking the whole Sourcing
       process, the About values and most of the home page with it. Scoping the
       hide to html:not(.no-js) makes the animation an enhancement again
       instead of a precondition for reading the site.
       Inline and first on purpose: a deferred file would let the page paint
       blank before it ran. */
    document.documentElement.classList.remove('no-js');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <!-- Hidden until the shell confirms a session, so a signed-out visitor never
       sees a flash of the panel's structure. This is cosmetic, not a control:
       the page contains no data to protect. -->
  <div class="admin" data-admin-shell hidden>
    <aside class="admin__side">
      <a class="admin__brand" href="../../modules/admin/index.html">
        <img src="../../assets/logo/gulfrabit-mark.png" alt="">
        <span>GulfRabit<small>Admin</small></span>
      </a>

      <nav class="anav" aria-label="Admin sections" data-admin-nav></nav>

      <div class="admin__who">
        <div class="admin__who-name" data-admin-name>—</div>
        <span class="admin__who-role" data-admin-role>—</span>
        <button type="button" class="admin__signout" data-admin-signout>Sign out</button>
      </div>
    </aside>

    <main class="admin__main" id="main">

<div class="admin__head">
        <div>
          <h1 class="admin__title">Profit &amp; loss</h1>
          <p class="admin__sub" data-pnl-period>Loading…</p>
        </div>
      </div>

      <form class="afilters" data-pnl-filters>
        <div class="afilters__field">
          <label for="pl-from">From</label>
          <input class="input-gr" id="pl-from" name="from" type="date" required>
        </div>
        <div class="afilters__field">
          <label for="pl-to">To</label>
          <input class="input-gr" id="pl-to" name="to" type="date" required>
        </div>
        <div class="afilters__actions">
          <button class="btn-gr btn-primary-gr btn-sm-gr" type="submit">Run</button>
        </div>
      </form>

      <!-- The caveat, when it applies. Placed ABOVE the figures rather than in
           a footnote: a number you read before the warning is a number you have
           already believed. -->
      <div class="acard" style="margin-bottom:var(--space-5);border-left:3px solid var(--gr-warning)"
           data-pnl-caveat hidden>
        <h2 class="h5" style="margin:0 0 var(--space-2)">Gross profit cannot be calculated</h2>
        <p class="admin__sub" style="margin:0" data-pnl-caveat-text></p>
      </div>

      <div class="aorder">
        <section class="acard" aria-labelledby="pi-head">
          <h2 class="h5" id="pi-head">Income</h2>
          <dl class="atotals" data-pnl-income></dl>
        </section>

        <section class="acard" aria-labelledby="pe-head">
          <h2 class="h5" id="pe-head">Expenses</h2>
          <dl class="atotals" data-pnl-expenses></dl>
        </section>

        <section class="acard" aria-labelledby="pr-head">
          <h2 class="h5" id="pr-head">Result</h2>
          <div class="acards" data-pnl-result></div>
        </section>
      </div>

      <p class="aerror" data-pnl-error hidden role="alert"></p>
    </main>
  </div>

</body>
