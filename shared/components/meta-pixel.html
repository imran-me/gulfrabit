  <meta name="gr-meta-pixel" content="__PIXEL_ID__">
  <!-- Meta Pixel - base code, including the one PageView. The id is set in
       Admin > Pixel setup: the server rewrites everything between the
       GENERATED-PIXEL markers when it changes and after every deploy, and the
       build fills it from shared/js/core/site-config.js until then. The meta
       line above is the whole block when the pixel is switched off. Every
       OTHER event comes from shared/js/core/analytics.js with an event_id;
       PageView mints its own below, and analytics.js mirrors that same id to
       the Conversions API instead of sending a second one. -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
    document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '__PIXEL_ID__');
    window.__grPageViewId = 'pv-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    fbq('track', 'PageView', {}, { eventID: window.__grPageViewId });
  </script>
