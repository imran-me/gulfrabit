# Push to main -> build here -> ship to Hostinger -> migrate.
#
# WHY THE BUILD HAPPENS ON GITHUB AND NOT ON THE SERVER
# -----------------------------------------------------
# Hostinger shared hosting has no reliable Composer and no Node. GitHub's runner
# has both. So the runner produces a finished application — vendor/ installed,
# assets built — and only the result is copied across. That also means the
# server never needs build tools, and a failed build never reaches the site.
#
# WHAT THIS DOES NOT DO
# ---------------------
# It never touches your data. `migrate` changes table STRUCTURE; it does not
# copy rows. Your orders and customers live on the server and nowhere else, and
# nothing in this file can overwrite them. There is no "sync the database" step
# because a push that could replace live records is one bad push away from
# losing the business's books.

name: Deploy to Hostinger

# MANUAL ONLY. GulfRabit deploys via cron on the server (see deploy.sh), which
# needs no secrets and no keys held by a third party. This workflow is kept as
# the alternative for when the build needs tools the shared host does not have
# — a Tailwind/PurgeCSS step, for instance, which needs Node.
#
# It does NOT run on push. Left on a push trigger with no secrets configured it
# would fail on every commit and mail a failure notice each time, which trains
# everyone to ignore build failures.
on:
  workflow_dispatch:

concurrency:
  # Two deploys overlapping would rsync half of one on top of the other.
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the PHP version hPanel reports for this hosting (8.3).
          # A mismatch compiles dependencies against one runtime and executes
          # them on another, and the failure shows up as a broken page long
          # after the deploy reported success.
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: |
          # --no-dev: PHPUnit and friends have no business on a live server.
          # --optimize-autoloader: one classmap instead of filesystem lookups.
          if [ -f composer.lock ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
          else
            echo "No composer.lock yet — resolving and creating one."
            composer update --no-dev --optimize-autoloader --no-interaction --prefer-dist
          fi

      - name: Rebuild static pages
        run: |
          # --theme-from, not a bare build. Every page now links only the theme
          # it was BUILT with, so a build that assumes Classic while the shop
          # publishes Trio makes first-time visitors paint Classic, wait for
          # /api/theme, fetch a stylesheet and flip — the flash the pre-paint
          # bootstrap exists to prevent, aimed at people who have never seen
          # the shop. The server knows the answer, so the build asks it.
          # Unreachable or unrecognised falls back to Classic; a deploy must
          # not fail because a decoration endpoint is down.
          python3 tools/assemble.py --theme-from https://gulfrabit.com/api/theme
          python3 tools/sitemap.py

      - name: Verify before shipping
        run: |
          # A deploy that fails these should never reach the site.
          python3 tools/php-check.py
          python3 tools/migration-order.py
          python3 tools/module-deps.py
          python3 tools/htaccess-check.py
          python3 tools/sync-delivery-copy.py --check
          python3 tools/gen-sourcing-facts.py --check

      - name: Ship to Hostinger
        uses: burnett01/rsync-deployments@7.0.1
        with:
          # --delete keeps the server identical to the repo, so a file you
          # remove here disappears there too. The excludes below are the things
          # that must SURVIVE that: they live only on the server.
          switches: >-
            -avzr --delete
            --exclude='.git*'
            --exclude='.env'
            --exclude='storage/'
            --exclude='bootstrap/cache/'
            --exclude='node_modules/'
            --exclude='tools/'
            --exclude='research/'
            --exclude='*.md'
          path: ./
          remote_path: ${{ secrets.HOSTINGER_PATH }}
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_port: ${{ secrets.HOSTINGER_PORT }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Migrate and warm caches
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            cd ${{ secrets.HOSTINGER_PATH }}
            # --force because a production migrate prompts for confirmation and
            # there is nobody at a keyboard to answer it.
            php artisan migrate --force
            # Caches are rebuilt AFTER the code lands, never before, or they
            # would cache the previous release's config and routes.
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
