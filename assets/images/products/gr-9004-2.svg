<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Digital Temp/Humidity Sensor (I²C)">
  <defs>
    <linearGradient id="accent" gradientTransform="rotate(53 .5 .5)"><stop offset="0" stop-color="#2A2A2A"/><stop offset="1" stop-color="#1BB4D4"/></linearGradient>
    <radialGradient id="glow" cx="43%" cy="45%" r="75%"><stop offset="0" stop-color="#2A2A2A" stop-opacity=".16"/><stop offset="65%" stop-color="#2A2A2A" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%"><stop offset="58%" stop-color="#101314" stop-opacity="0"/><stop offset="100%" stop-color="#101314" stop-opacity=".07"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#101314" fill-opacity=".05"/></pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#101314" flood-opacity=".16"/></filter>
  </defs>
  <rect width="400" height="500" fill="#FFFFFF"/>
  <rect width="400" height="500" fill="url(#dots)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <g filter="url(#soft)" transform="translate(200 250) scale(1.28) translate(-200 -232)"><rect fill="url(#accent)" stroke="rgba(16,19,20,.14)" stroke-width="1.5" x="144" y="176" rx="6" width="112" height="112"/>
    <rect stroke="rgba(255,255,255,.55)" fill="none" stroke-width="1.2" x="166" y="198" width="68" height="68"/>
    <rect fill="url(#accent)" x="130" y="188" width="14" height="8"/><rect fill="url(#accent)" x="256" y="188" width="14" height="8"/><rect fill="url(#accent)" x="130" y="210" width="14" height="8"/><rect fill="url(#accent)" x="256" y="210" width="14" height="8"/><rect fill="url(#accent)" x="130" y="232" width="14" height="8"/><rect fill="url(#accent)" x="256" y="232" width="14" height="8"/><rect fill="url(#accent)" x="130" y="254" width="14" height="8"/><rect fill="url(#accent)" x="256" y="254" width="14" height="8"/><rect fill="url(#accent)" x="130" y="276" width="14" height="8"/><rect fill="url(#accent)" x="256" y="276" width="14" height="8"/></g>
  <rect width="400" height="500" fill="url(#vig)"/>
</svg>
