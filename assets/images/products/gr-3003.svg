<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Polarised Acetate Sunglasses">
  <defs>
    <linearGradient id="accent" gradientTransform="rotate(10 .5 .5)"><stop offset="0" stop-color="#8A8F8C"/><stop offset="1" stop-color="#1BB4D4"/></linearGradient>
    <radialGradient id="glow" cx="45%" cy="36%" r="75%"><stop offset="0" stop-color="#8A8F8C" stop-opacity=".16"/><stop offset="65%" stop-color="#8A8F8C" stop-opacity="0"/></radialGradient>
    <radialGradient id="vig" cx="50%" cy="44%" r="78%"><stop offset="58%" stop-color="#101314" stop-opacity="0"/><stop offset="100%" stop-color="#101314" stop-opacity=".07"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#101314" fill-opacity=".05"/></pattern>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#101314" flood-opacity=".16"/></filter>
  </defs>
  <rect width="400" height="500" fill="#FFFFFF"/>
  <rect width="400" height="500" fill="url(#dots)"/>
  <rect width="400" height="500" fill="url(#glow)"/>
  <g filter="url(#soft)" transform="translate(200 232) scale(1.0) translate(-200 -232)"><path fill="url(#accent)" stroke="rgba(16,19,20,.14)" stroke-width="1.5" d="M136 202 l60 -46 l86 0 l0 86 l-46 60 z"/>
        <circle stroke="rgba(255,255,255,.55)" fill="none" stroke-width="1.2" cx="240" cy="200" r="10"/>
        <path stroke="rgba(255,255,255,.55)" fill="none" stroke-width="1.2" d="M160 272 l70 -70"/></g>
  <rect width="400" height="500" fill="url(#vig)"/>
</svg>
