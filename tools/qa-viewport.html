<!doctype html>
<!-- Responsive QA harness (author-time only; never linked from the site).
     Headless Chrome clamps its viewport to ~526px, so true 375px cannot be
     screenshotted directly. An iframe establishes its own viewport for media
     queries, so framing the page at an exact width gives a truthful render
     AND lets us measure real horizontal overflow (same-origin). -->
<meta charset="utf-8">
<title>GulfRabit · viewport QA</title>
<style>
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:#20242a; color:#fff; }
  .rail { display:flex; gap:16px; padding:16px; align-items:flex-start; }
  .col { flex:0 0 auto; }
  .cap { padding:6px 8px; font-weight:600; letter-spacing:.02em; }
  .verdict { padding:6px 8px; font-family:ui-monospace,monospace; font-size:12px; white-space:pre; }
  .ok   { background:#123d1e; color:#9AE6A0; }
  .bad  { background:#4a1420; color:#FF9AA6; }
  iframe { border:0; background:#fff; display:block; }
</style>
<div class="rail" id="rail"></div>
<script>
  const qs = new URLSearchParams(location.search);
  // ?w= narrows the audit to one width, ?h= sets frame height, ?s= scrolls the
  // framed page so a specific band (e.g. the buy box) is visible in a shot.
  const only = qs.get('w');
  const fh = +(qs.get('h') || 0);
  const scrollTo = +(qs.get('s') || 0);
  const click = qs.get('click');
  const cartN = +(qs.get('cart') || 0);
  const district = qs.get('district');
  const autofill = qs.get('fill');
  const ALL = [[375, 2400], [414, 2400], [768, 2000]];
  const SIZES = (only ? ALL.filter(([w]) => String(w) === only) : ALL)
    .map(([w, h]) => [w, fh || h]);
  const target = qs.get('u') || '../modules/catalog/product.html?id=gr-1001';

  const rail = document.getElementById('rail');

  /**
   * ?cart=N seeds N real products into the cart before framing the page.
   * Cart/checkout render an empty state otherwise, so their forms never enter
   * the DOM and cannot be audited. The harness shares an origin with the site,
   * so localStorage written here is the same storage the framed page reads.
   * Mirrors KEYS.CART ('cart') behind the 'gr:' prefix from core/storage.js.
   */
  async function seedCart(n) {
    const { products } = await (await fetch('../data/products.json')).json();
    const lines = products.slice(0, n).map((p) => ({
      id: p.id, title: p.title, brand: p.brand || '',
      price: p.price, image: p.image, qty: 1,
    }));
    localStorage.setItem('gr:cart', JSON.stringify(lines));
    return lines.reduce((s, l) => s + l.price * l.qty, 0);
  }

  function buildFrames() {
  SIZES.forEach(([w, h]) => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `<div class="cap">${w}px</div>`;
    const f = document.createElement('iframe');
    f.width = w; f.height = h; f.src = target;
    const v = document.createElement('div');
    v.className = 'verdict'; v.textContent = 'measuring…';
    col.appendChild(f); col.appendChild(v);
    rail.appendChild(col);

    f.addEventListener('load', () => {
      // Give lazy/JS-rendered content a beat to settle before measuring.
      setTimeout(() => {
        try {
          // ?fill=1 populates every required field with a plausible value, so
          // multi-step forms can be advanced past their validation gate and the
          // later steps actually audited.
          if (autofill) {
            const doc = f.contentDocument;
            doc.querySelectorAll('[data-validate*="required"]').forEach((el) => {
              if (el.value) return;
              if (el.tagName === 'SELECT') {
                const real = [...el.options].find((o) => o.value && !o.disabled);
                if (real) el.value = real.value;
              } else if (el.name === 'phone') {
                el.value = '01712345678';
              } else if (el.type === 'email') {
                el.value = 'qa@example.com';
              } else {
                el.value = 'QA test value';
              }
              el.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
              el.dispatchEvent(new f.contentWindow.Event('change', { bubbles: true }));
            });
          }

          // ?click=<selector> activates something inside the frame first, so
          // tab panels and other JS-revealed content can be audited too.
          if (click) {
            const el = f.contentDocument.querySelector(click);
            if (el) el.click();
          }
          if (scrollTo) {
            // style.css sets `html { scroll-behavior: smooth }`, and a smooth
            // scroll never completes under --virtual-time-budget, so force it
            // to an instant jump before measuring/screenshotting.
            f.contentDocument.documentElement.style.scrollBehavior = 'auto';
            f.contentWindow.scrollTo(0, scrollTo);
          }
          const d = f.contentDocument.documentElement;
          const scrollW = Math.max(d.scrollWidth, f.contentDocument.body.scrollWidth);
          const clientW = d.clientWidth;
          const over = scrollW - clientW;
          // Find the widest offending elements so a failure is actionable.
          let culprits = [];
          if (over > 0) {
            f.contentDocument.querySelectorAll('*').forEach((el) => {
              const r = el.getBoundingClientRect();
              if (r.right > clientW + 1) {
                culprits.push(`${el.tagName.toLowerCase()}${el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).slice(0,2).join('.') : ''} → ${Math.round(r.right)}px`);
              }
            });
            culprits = [...new Set(culprits)].slice(0, 6);
          }
          v.className = 'verdict ' + (over > 0 ? 'bad' : 'ok');
          v.textContent = over > 0
            ? `OVERFLOW +${over}px\nscrollW ${scrollW} > ${clientW}\n` + culprits.join('\n')
            : `OK  no overflow\nscrollW ${scrollW} = ${clientW}`;
          v.dataset.result = over > 0 ? 'OVERFLOW' : 'OK';
        } catch (e) {
          v.className = 'verdict bad';
          v.textContent = 'measure failed: ' + e.message;
        }
      }, 2500);
    });
  });
  }

  (async () => {
    // ?go=<url> seeds, then navigates the TOP document there. --dump-dom cannot
    // see inside an iframe, so DOM inspection of a populated cart/checkout has
    // to happen at top level.
    const go = qs.get('go');
    // ?district=<key> pre-selects a checkout district. checkout-page.js restores
    // it from this key on load, so seeding it exercises the real restore path
    // rather than faking a change event.
    if (district) localStorage.setItem('gr:checkout-district', JSON.stringify(district));
    if (go) {
      if (cartN) await seedCart(cartN); else localStorage.removeItem('gr:cart');
      location.replace(go);
      return;
    }
    if (cartN) {
      const subtotal = await seedCart(cartN);
      const note = document.createElement('div');
      note.className = 'cap';
      note.textContent = `seeded cart: ${cartN} line(s), subtotal ${subtotal}`;
      document.body.insertBefore(note, rail);
    } else {
      localStorage.removeItem('gr:cart');
    }
    buildFrames();
  })();
</script>
